version: '3.8'

services:
  ielts-scorer-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ielts-writing-scorer:v2.2
    container_name: ielts_writing_scorer
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=5000
    volumes:
      # Optional: persist models or data
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional interactive CLI tester service:
  # Run with: docker compose run --rm ielts-scorer-cli
  ielts-scorer-cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: ielts-writing-scorer:v2.2
    container_name: ielts_writing_scorer_cli
    stdin_open: true
    tty: true
    entrypoint: ["python", "test_scorer.py"]
    volumes:
      - ./data:/app/data:ro
